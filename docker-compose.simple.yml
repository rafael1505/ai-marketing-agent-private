version: '3'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://localhost:27017
      - MONGODB_DB=ai_marketing_agent_test
      - SECRET_KEY=test_key_for_local_dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
