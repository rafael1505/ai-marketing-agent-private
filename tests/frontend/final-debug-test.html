<!DOCTYPE html>
<html>
<head>
    <title>Final Provider Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 4px solid #007cba; }
        .error { border-left-color: #ff0000; background: #fff5f5; }
        .success { border-left-color: #00aa00; background: #f5fff5; }
        .warning { border-left-color: #ffaa00; background: #fffaf0; }
        pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
        button { padding: 10px 20px; margin: 10px 5px; background: #007cba; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005a87; }
    </style>
</head>
<body>
    <h1>Final Provider Debug Test</h1>
    <p>This test uses the correct localStorage key: <code>'ai-provider-configurations'</code></p>
    
    <button onclick="clearCorrectCache()">Clear CORRECT Cache</button>
    <button onclick="testAPI()">Test API</button>
    <button onclick="testFullFlow()">Test Full Flow</button>
    
    <div id="output"></div>

    <script>
        function log(message, type = 'log') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            output.appendChild(div);
            console.log(message);
        }

        function clearCorrectCache() {
            const CORRECT_KEY = 'ai-provider-configurations';
            
            // Check what's in cache first
            const cached = localStorage.getItem(CORRECT_KEY);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    log(`🗑️ Found cached data with ${parsed.length} providers`, 'warning');
                    
                    const openai = parsed.find(p => p.id === 'openai');
                    if (openai) {
                        log(`🔍 OpenAI WAS in cached data: configured=${openai.isConfigured}`, 'warning');
                    } else {
                        log(`🔍 OpenAI was NOT in cached data`, 'warning');
                    }
                } catch (e) {
                    log(`🔍 Found invalid cached data: ${e.message}`, 'warning');
                }
            } else {
                log(`🔍 No cached data found under key '${CORRECT_KEY}'`, 'warning');
            }
            
            // Clear it
            localStorage.removeItem(CORRECT_KEY);
            log(`✅ Cleared localStorage key: '${CORRECT_KEY}'`, 'success');
            
            // Also clear other provider-related keys
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('provider') || key.includes('ai'))) {
                    keys.push(key);
                }
            }
            
            if (keys.length > 0) {
                keys.forEach(key => localStorage.removeItem(key));
                log(`🗑️ Also cleared: ${keys.join(', ')}`, 'success');
            }
        }

        async function testAPI() {
            log("🌐 Testing direct API call...");
            try {
                const response = await fetch('/api/v1/ai-providers');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`📡 API returned ${data.length} providers`, 'success');
                
                // Check for OpenAI
                const openai = data.find(p => p.id === 'openai');
                if (openai) {
                    log(`✅ OpenAI found in API: configured=${openai.isConfigured}, apiKey=${openai.apiKey}`, 'success');
                } else {
                    log(`❌ OpenAI NOT found in API response`, 'error');
                }
                
                // Show all providers
                data.forEach((p, i) => {
                    log(`${i+1}. ${p.name} (id: ${p.id}, configured: ${p.isConfigured})`);
                });
                
            } catch (error) {
                log(`❌ API test failed: ${error.message}`, 'error');
            }
        }

        async function testFullFlow() {
            log("🔄 Testing full getUserAIProviders flow...");
            
            const CORRECT_KEY = 'ai-provider-configurations';
            
            // Step 1: Clear cache
            localStorage.removeItem(CORRECT_KEY);
            log("1. Cleared cache");
            
            // Step 2: Simulate the fixed getUserAIProviders logic
            try {
                // Check cache (should be empty)
                const cached = localStorage.getItem(CORRECT_KEY);
                if (cached) {
                    log("❌ Cache should be empty but found data", 'error');
                    return;
                }
                log("2. Cache is empty (correct)");
                
                // Fetch from API
                const response = await fetch('/api/v1/ai-providers');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                log(`3. API returned ${data.length} providers`);
                
                // NEW FIXED LOGIC: Store ALL providers (including masked)
                localStorage.setItem(CORRECT_KEY, JSON.stringify(data));
                log("4. Stored ALL providers in localStorage (NEW LOGIC)", 'success');
                
                // Verify storage
                const stored = localStorage.getItem(CORRECT_KEY);
                const parsed = JSON.parse(stored);
                log(`5. Verified: ${parsed.length} providers stored`);
                
                const storedOpenai = parsed.find(p => p.id === 'openai');
                if (storedOpenai) {
                    log(`✅ SUCCESS: OpenAI is now in localStorage with configured=${storedOpenai.isConfigured}`, 'success');
                } else {
                    log(`❌ FAIL: OpenAI still not in localStorage`, 'error');
                }
                
                log(`📋 Complete provider list in localStorage:`);
                parsed.forEach((p, i) => {
                    log(`  ${i+1}. ${p.name} (configured: ${p.isConfigured})`);
                });
                
            } catch (error) {
                log(`❌ Full flow test failed: ${error.message}`, 'error');
            }
        }

        // Auto-run on page load
        window.onload = function() {
            log("🚀 Final debug tool loaded.");
            log("📝 This tool uses the CORRECT localStorage key: 'ai-provider-configurations'");
            
            // Show current cache status
            const cached = localStorage.getItem('ai-provider-configurations');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    log(`📦 Current cache has ${parsed.length} providers`, 'warning');
                    
                    const openai = parsed.find(p => p.id === 'openai');
                    if (openai) {
                        log(`🎯 OpenAI IS in current cache: configured=${openai.isConfigured}`, 'warning');
                    } else {
                        log(`🎯 OpenAI is NOT in current cache`, 'warning');
                    }
                } catch (e) {
                    log(`📦 Current cache has invalid data`, 'warning');
                }
            } else {
                log(`📦 No current cache data`, 'warning');
            }
        };
    </script>
</body>
</html>
