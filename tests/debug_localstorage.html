<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Debug</title>
</head>
<body>
    <h1>LocalStorage Debug Tool</h1>
    <div id="output"></div>
    <script>
        function checkLocalStorage() {
            const output = document.getElementById('output');
            const keys = [
                'ai-provider-configurations',
                'userAIProviders', 
                'ai-providers-config'
            ];
            
            output.innerHTML = '<h2>LocalStorage Contents:</h2>';
            
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                output.innerHTML += `<h3>${key}:</h3>`;
                if (value) {
                    try {
                        const parsed = JSON.parse(value);
                        output.innerHTML += `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                    } catch (e) {
                        output.innerHTML += `<pre>${value}</pre>`;
                    }
                } else {
                    output.innerHTML += '<p>Not found</p>';
                }
            });
            
            // Show all localStorage keys
            output.innerHTML += '<h3>All LocalStorage Keys:</h3>';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                output.innerHTML += `<p>${key}</p>`;
            }
        }
        
        // Check immediately and refresh every 2 seconds
        checkLocalStorage();
        setInterval(checkLocalStorage, 2000);
    </script>
</body>
</html>
