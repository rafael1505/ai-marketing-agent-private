<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Test</title>
</head>
<body>
    <h1>LocalStorage Test</h1>
    <div>
        <button onclick="testSave()">Save Test Config</button>
        <button onclick="testLoad()">Load Test Config</button>
        <button onclick="clearAll()">Clear All</button>
    </div>
    <div id="output"></div>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<div>' + message + '</div>';
            console.log(message);
        }
        
        function testSave() {
            const testConfig = {
                apiKey: 'sk-test123456789',
                selectedModel: 'dall-e-3',
                maxTokens: 1000,
                temperature: 0.7
            };
            
            const key = 'provider-config-openai';
            localStorage.setItem(key, JSON.stringify(testConfig));
            log('Saved test config: ' + JSON.stringify(testConfig));
            log('Verification - stored value: ' + localStorage.getItem(key));
        }
        
        function testLoad() {
            const key = 'provider-config-openai';
            const stored = localStorage.getItem(key);
            log('Loaded from localStorage: ' + stored);
            
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    log('Parsed config: ' + JSON.stringify(parsed));
                } catch (error) {
                    log('Error parsing: ' + error.message);
                }
            } else {
                log('No data found for key: ' + key);
            }
        }
        
        function clearAll() {
            localStorage.clear();
            log('Cleared all localStorage data');
        }
        
        // Show all localStorage keys on load
        window.onload = function() {
            log('Current localStorage keys:');
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                log(`${key}: ${value}`);
            }
        };
    </script>
</body>
</html>
