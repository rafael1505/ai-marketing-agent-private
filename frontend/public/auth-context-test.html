<!DOCTYPE html>
<html>
<head>
    <title>Authentication Context Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    </style>
</head>
<body>
    <h1>Authentication Context Test</h1>
    <div id="results">
        <div class="loading">Running tests...</div>
    </div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, isSuccess) {
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        function runTest(url, testName) {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                
                let errorOccurred = false;
                
                // Listen for console errors
                const originalError = console.error;
                console.error = function(...args) {
                    const message = args.join(' ');
                    if (message.includes('useAuth must be used within an AuthProvider')) {
                        errorOccurred = true;
                        addResult(`${testName}: FAILED - useAuth error occurred`, false);
                        resolve(false);
                    }
                    originalError.apply(console, args);
                };
                
                iframe.onload = function() {
                    setTimeout(() => {
                        if (!errorOccurred) {
                            addResult(`${testName}: PASSED - No useAuth errors`, true);
                            resolve(true);
                        }
                        document.body.removeChild(iframe);
                        console.error = originalError;
                    }, 2000);
                };
                
                iframe.onerror = function() {
                    addResult(`${testName}: FAILED - Page load error`, false);
                    resolve(false);
                    document.body.removeChild(iframe);
                    console.error = originalError;
                };
                
                document.body.appendChild(iframe);
            });
        }
        
        async function runAllTests() {
            results.innerHTML = '';
            
            const tests = [
                { url: '/component-showcase', name: 'Component Showcase' },
                { url: '/auth-test', name: 'Auth Test Page' },
                { url: '/en/materials', name: 'Materials Page' },
                { url: '/en/dashboard', name: 'Dashboard Page' },
                { url: '/en/login', name: 'Login Page' }
            ];
            
            for (const test of tests) {
                addResult(`Testing ${test.name}...`, true);
                await runTest(test.url, test.name);
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait between tests
            }
            
            addResult('All tests completed!', true);
        }
        
        // Start tests
        runAllTests();
    </script>
</body>
</html>
