<!DOCTYPE html>
<html>
<head>
    <title>Settings Page Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Settings Page Debug Test</h1>
    
    <div class="test-result info">
        <h3>Testing Settings Page Accessibility</h3>
        <p>Attempting to access the settings page...</p>
        <div id="test-results"></div>
    </div>

    <div class="test-result info">
        <h3>Console Output</h3>
        <div id="console-output"></div>
    </div>

    <script>
        const resultsDiv = document.getElementById('test-results');
        const consoleDiv = document.getElementById('console-output');
        
        // Capture console messages
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            consoleDiv.innerHTML += '<div style="color: blue;">LOG: ' + args.join(' ') + '</div>';
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            consoleDiv.innerHTML += '<div style="color: red;">ERROR: ' + args.join(' ') + '</div>';
            originalError.apply(console, args);
        };

        // Test 1: Check if settings page responds
        fetch('/en/settings')
            .then(response => {
                if (response.ok) {
                    resultsDiv.innerHTML += '<div class="success">✅ Settings page responds with status: ' + response.status + '</div>';
                    return response.text();
                } else {
                    resultsDiv.innerHTML += '<div class="error">❌ Settings page returned status: ' + response.status + '</div>';
                    throw new Error('Page not found');
                }
            })
            .then(html => {
                if (html.includes('Settings Page - Debug Version')) {
                    resultsDiv.innerHTML += '<div class="success">✅ Debug version is loading</div>';
                } else if (html.includes('Settings')) {
                    resultsDiv.innerHTML += '<div class="success">✅ Settings page is loading (original version)</div>';
                } else {
                    resultsDiv.innerHTML += '<div class="error">❌ Settings page content not recognized</div>';
                }
            })
            .catch(error => {
                resultsDiv.innerHTML += '<div class="error">❌ Error accessing settings page: ' + error.message + '</div>';
            });

        // Test 2: Check if API routes are working
        fetch('/api/test-nextresponse')
            .then(response => response.json())
            .then(data => {
                resultsDiv.innerHTML += '<div class="success">✅ API routes are working: ' + JSON.stringify(data) + '</div>';
            })
            .catch(error => {
                resultsDiv.innerHTML += '<div class="error">❌ API routes not working: ' + error.message + '</div>';
            });

        // Test 3: Check for JavaScript errors
        window.addEventListener('error', function(e) {
            resultsDiv.innerHTML += '<div class="error">❌ JavaScript Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
        });

        // Test 4: Check for unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
            resultsDiv.innerHTML += '<div class="error">❌ Unhandled Promise Rejection: ' + e.reason + '</div>';
        });
    </script>
</body>
</html>
