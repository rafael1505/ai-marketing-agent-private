<!DOCTYPE html>
<html>
<head>
    <title>Clear Storage</title>
</head>
<body>
    <h1>Clearing localStorage...</h1>
    <script>
        localStorage.clear();
        sessionStorage.clear();
        console.log('Storage cleared');
        document.body.innerHTML += '<p>Storage cleared! You can close this tab.</p>';
        setTimeout(() => {
            window.location.href = '/en/materials';
        }, 2000);
    </script>
</body>
</html>
